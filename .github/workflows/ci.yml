name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Fuzz HTML parser (short)
        run: go test ./html -run '^$' -fuzz FuzzParse -fuzztime 20s
      - name: Build
        run: go build -o gobrowser ./cmd/gobrowser
      - name: Smoke test (DOM dump of HN-like fixture)
        run: |
          ./gobrowser -dump=dom html/testdata/hn_like.html > dom.txt
          grep -q 'table id="hnmain"' dom.txt
          head -40 dom.txt
